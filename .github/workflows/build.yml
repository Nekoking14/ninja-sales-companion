name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so git rev-list --count HEAD is accurate

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auto-set version from commit count
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.$COUNT"
          echo "Building version $VERSION"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('./package.json','utf8'));
            p.version = '$VERSION';
            fs.writeFileSync('./package.json', JSON.stringify(p, null, 2));
          "
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Build React frontend
        working-directory: client
        run: npx vite build

      - name: Package Windows installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .exe installer (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NinjaOne-Sales-Companion-Windows
          path: dist/*.exe
          retention-days: 30

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.APP_VERSION }}" dist/*.exe \
            --title "v${{ env.APP_VERSION }}" \
            --notes "Built from commit ${{ github.sha }}" \
            --repo ${{ github.repository }}
