name: Build & Release Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # needed for full commit count

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Compute version from total commit count ─────────────────────────
      - name: Compute version
        shell: pwsh
        run: |
          $count = git rev-list --count HEAD
          $version = "1.0.$count"
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "Computed version: $version"

      - name: Stamp version into package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ env.APP_VERSION }}"
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding UTF8
          echo "package.json version set to ${{ env.APP_VERSION }}"

      # ── Install dependencies ────────────────────────────────────────────
      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      # ── Build ───────────────────────────────────────────────────────────
      - name: Build React frontend
        working-directory: client
        run: npx vite build

      # ── Publish release to GitHub ───────────────────────────────────────
      # --publish always  →  creates a GitHub release + uploads the .exe + latest.yml
      - name: Build installer and publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
