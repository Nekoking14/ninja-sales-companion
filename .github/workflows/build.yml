name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Build React frontend
        working-directory: client
        run: npx vite build

      - name: Package Windows installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .exe installer (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NinjaOne-Sales-Companion-Windows
          path: dist/*.exe
          retention-days: 30

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" dist/*.exe \
            --title "v$VERSION" \
            --notes "Automated build from commit ${{ github.sha }}" \
            --repo ${{ github.repository }} \
          || echo "Release v$VERSION already exists — bump the version in package.json to publish a new one."
